server.port=${PORT:8080}

# ---- MySQL（生产环境请用环境变量注入，勿写死密码） ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketdb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- 对话模型：DeepSeek（OpenAI 兼容协议，platform.deepseek.com 申请 Key） ----
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY:}
langchain4j.open-ai.chat-model.model-name=${CHAT_MODEL:deepseek-v4-flash}
langchain4j.open-ai.chat-model.base-url=${CHAT_BASE_URL:https://api.deepseek.com}

# ---- 流式对话模型 ----
langchain4j.open-ai.streaming-chat-model.api-key=${DEEPSEEK_API_KEY:}
langchain4j.open-ai.streaming-chat-model.model-name=${CHAT_MODEL:deepseek-v4-flash}
langchain4j.open-ai.streaming-chat-model.base-url=${CHAT_BASE_URL:https://api.deepseek.com}

# ---- RAG 向量模型：阿里云 DashScope（百炼控制台申请 Key，与 DeepSeek Key 不同） ----
langchain4j.community.dashscope.embedding-model.api-key=${DASHSCOPE_API_KEY:}

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
